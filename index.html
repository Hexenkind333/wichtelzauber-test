function planDetail(pid){let p=state.plans.find(x=>x.id===pid),a=act(p);modal('📖 '+planName(p),`<p>${esc(planSummary(p))}</p><h3>Schritt-für-Schritt-Anleitung</h3><p style="white-space:pre-wrap">${esc(p.freeSteps||a?.steps||'Keine Anleitung hinterlegt.')}</p><h3>Materialien</h3><ul>${splitMaterials(p.freeMaterials||a?.materials||'').map(m=>`<li>${esc(m)}</li>`).join('')||'<li>Keine Materialien</li>'}</ul><p>⏱️ ${esc(a?.minutes||'–')} Minuten</p>${taskDisplay(p,'before','👧 Vor dem Schlafengehen')}${taskDisplay(p,'after','🌙 Nach dem Einschlafen')}<h3>Briefideen</h3>${(a?.briefs||[]).map(b=>`<div class="letter"><b>${esc(b.title)}</b><p style="white-space:pre-wrap">${esc(b.body)}</p></div>`).join('')||'<p>Keine Briefideen hinterlegt.</p>'}${(a?.images||[]).map(x=>`<img class="thumb" src="${x}" alt="Aktionsfoto">`).join('')}<p>${completionButton(p)}</p>`)}
function checkPlan(pid,key,v){let p=state.plans.find(x=>x.id===pid);p[key]=v;save();render()}
function calendar(){let start=view==='week'?new Date(focus):new Date(focus.getFullYear(),focus.getMonth(),1);if(view==='week')start.setDate(start.getDate()-(start.getDay()+6)%7);let end=view==='week'?new Date(start.getFullYear(),start.getMonth(),start.getDate()+6):new Date(start.getFullYear(),start.getMonth()+1,0);let cells=[],date=new Date(start.getFullYear(),start.getMonth(),start.getDate(),12);if(view==='month')date.setDate(1-(date.getDay()+6)%7);let stop=view==='month'?new Date(end.getFullYear(),end.getMonth(),end.getDate()+(7-end.getDay())%7,12):new Date(end.getFullYear(),end.getMonth(),end.getDate(),12);for(;date<=stop;date.setDate(date.getDate()+1)){let d=iso(date),ps=plans().filter(p=>p.date===d);cells.push(`<div class="day" onclick="day('${d}')"><strong class="calendar-date">${view==='week'?['So','Mo','Di','Mi','Do','Fr','Sa'][date.getDay()]+' · ':''}${nice(d)}</strong>${ps.map(p=>`<span class="event">${esc(planName(p))}</span>`).join('')}</div>`)}return `<div class="flex spread"><h2>📅 Kalender</h2><div>${button('Monat',"view='month';render()")}${button('Woche',"view='week';render()")}</div></div><div class="card"><div class="flex spread"><button onclick="shift(-1)">‹</button><h3>${start.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</h3><button onclick="shift(1)">›</button></div><div class="calendar ${view==='week'?'week-list':''}">${view==='month'?['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<b>${x}</b>`).join(''):''}${cells.join('')}</div><p class="muted">Tag anklicken, um eine Aktion einzuplanen.</p></div>`}
function shift(n){if(view==='week')focus.setDate(focus.getDate()+7*n);else focus.setMonth(focus.getMonth()+n);render()}function day(d){go('planning');editPlan('',d)}
function searchIdeas(input){const pos=input.selectionStart;query=input.value;render();const next=document.getElementById('ideaSearch');if(next){next.focus({preventScroll:true});next.setSelectionRange(pos,pos)}}
function library(){let cats=[...new Set(state.library.map(x=>x.category))].sort(),a=state.library.filter(x=>(x.name+x.category+x.summary).toLowerCase().includes(query.toLowerCase())&&(!window.catFilter||x.category===window.catFilter));return `<div class="flex spread"><h2>📖 Aktionen & Handbuch</h2><button class="primary" onclick="editIdea()">+ Neue Idee</button></div><p>Hier sammelst du Ideen ohne Datum. Erst in der Jahresplanung legst du die Termine fest.</p><div class="card"><input id="ideaSearch" placeholder="Ideen durchsuchen" value="${esc(query)}" oninput="searchIdeas(this)"><select onchange="window.catFilter=this.value;render()"><option value="">Alle Kategorien</option>${cats.map(c=>`<option value="${esc(c)}" ${window.catFilter===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div>${a.map(x=>`<div class="card"><span class="pill">${esc(x.category)}</span><h3>${esc(x.name)}</h3><p>${esc(x.summary)}</p>${x.images.map(src=>`<img class="thumb" src="${src}" alt="Aktionsfoto">`).join('')}<div class="actions">${button('📖 Anleitung',`ideaDetail('${x.id}')`)}${button('✏️ Bearbeiten',`editIdea('${x.id}')`)}${button('📅 Einplanen',`editPlan('','','${x.id}')`)}${button('🗑️ Löschen',`deleteIdea('${x.id}')`)}</div></div>`).join('')}`}
function ideaDetail(aid){let a=state.library.find(x=>x.id===aid);modal(a.name,`<p>${esc(a.summary)}</p><h3>Anleitung</h3><p style="white-space:pre-wrap">${esc(a.steps)}</p><p>⏱️ ${esc(a.minutes)} Minuten</p><h3>Materialien</h3><p>${esc(a.materials)}</p><h3>Briefideen</h3>${(a.briefs||[]).map((b,i)=>`<div class="note"><b>${esc(typeof b==='string'?'Briefidee '+(i+1):b.title)}</b><p style="white-space:pre-wrap">${esc(typeof b==='string'?b:b.body)}</p></div>`).join('')||'<p>Keine Briefideen.</p>'}${a.images.map(src=>`<img class="thumb" src="${src}" alt="Foto">`).join('')}`)}
function editIdea(aid=''){let a=state.library.find(x=>x.id===aid)||{name:'',category:'Aktion',summary:'',steps:'',materials:'',minutes:10,briefs:[],images:[]};modal(aid?'Idee bearbeiten':'Neue Idee',`<form id="ideaForm" onsubmit="saveIdea(event,'${aid}')">${field('Name','name',a.name)}<div class="field"><label>Kategorie</label><select name="category">${['Vorbereitung','Einzug','Aktion','Streich','Alltägliches','Zauber','Abschied','Sonstiges'].map(c=>`<option ${a.category===c?'selected':''}>${c}</option>`).join('')}</select></div>${area('Kurzbeschreibung','summary',a.summary)}${area('Schritt-für-Schritt-Anleitung','steps',a.steps)}<h3>🧺 Materialien</h3><p class="muted">Material eintippen und Enter drücken.</p><div id="materialTags">${splitMaterials(a.materials).map(x=>tag(x)).join('')}</div><input id="newMaterial" placeholder="Material hinzufügen" onkeydown="if(event.key==='Enter'){event.preventDefault();addMaterialTag()}"><button type="button" onclick="addMaterialTag()">+ Material hinzufügen</button>${field('Zeitaufwand (Minuten)','minutes',a.minutes,'number')}<h3>✉️ Briefideen</h3><div id="briefFields">${(a.briefs||[]).map((b,i)=>briefFieldHtml(typeof b==='string'?'Briefidee '+(i+1):b.title,typeof b==='string'?b:b.body)).join('')}</div><button type="button" class="primary" onclick="addBriefField()">✉️ + Weiteren Brief hinzufügen</button><p class="muted small" id="briefCount">Jede Briefidee erhält einen eigenen Titel und Text. Du kannst beliebig viele hinzufügen.</p><div class="field"><label>Vorhandenen Brief aus „Briefe“ übernehmen</label><select id="libraryLetter"><option value="">Bitte auswählen</option>${state.letters.map(l=>`<option value="${l.id}">${esc(l.title)}</option>`).join('')}</select><button type="button" onclick="useLibraryLetter()">+ Ausgewählten Brief hinzufügen</button></div><h3>🖼️ Bilder</h3><input type="file" accept="image/*" multiple id="ideaImages"><p class="muted small">Neue Bilder werden automatisch verkleinert. Vorhandene Bilder bleiben unverändert.</p><p id="imageCount">${a.images.length} vorhandene Bilder</p><div id="existingIdeaImages" class="image-manage-grid">${(a.images||[]).map((src,i)=>`<div class="image-manage-item" data-image-index="${i}"><img src="${src}" alt="Gespeichertes Bild ${i+1}"><button type="button" class="danger" onclick="removeIdeaImage(this)">🗑️ Bild entfernen</button></div>`).join('')}</div><p class="muted small">Ein Bild wird erst beim Speichern der Idee endgültig entfernt. Mit ✕ kannst du abbrechen.</p><button class="primary">Idee speichern</button></form>`)}
function removeIdeaImage(btn){if(!confirm('Dieses Bild aus der Idee entfernen? Die Änderung wird erst mit „Idee speichern“ übernommen.'))return;btn.closest('.image-manage-item').remove();let n=document.querySelectorAll('#existingIdeaImages .image-manage-item').length;document.getElementById('imageCount').textContent=n+' vorhandene Bilder (nach dem Speichern)'}
async function saveIdea(e,aid){e.preventDefault();let f=e.target,o=Object.fromEntries(new FormData(f)),a=state.library.find(x=>x.id===aid);let imgs=a?.images?Array.from(document.querySelectorAll('#existingIdeaImages .image-manage-item'),el=>a.images[Number(el.dataset.imageIndex)]):[];for(let file of document.getElementById('ideaImages').files){if(file.size>15000000){alert('Bitte Bilder unter 15 MB wählen.');return}let src=await window.wichtelCompressImage(file);imgs.push(src)}o.materials=[...f.querySelectorAll('#materialTags [data-material]')].map(x=>x.dataset.material).join(', ');o.briefs=[...f.querySelectorAll('.briefEntry')].map(x=>({title:x.querySelector('.briefTitle').value.trim()||'Ohne Titel',body:x.querySelector('.briefIdea').value.trim()})).filter(x=>x.body);o.images=imgs;if(a)Object.assign(a,o);else state.library.push({id:id(),...o});commit()}function deleteIdea(aid){if(state.plans.some(p=>p.actionId===aid)){alert('Diese Idee ist noch in einem Jahresplan verwendet. Entferne sie dort zuerst.');return}if(confirm('Idee löschen?')){state.library=state.library.filter(x=>x.id!==aid);save();render()}}
function planning(){let ps=plans(),days=[...new Set(ps.map(p=>p.date))];return `<div class="flex spread"><h2>🗓️ Planung: ${esc(year().name)}</h2><button class="primary" onclick="editPlan()">+ Aktion einplanen</button></div><p>Aktionen aus dem Handbuch oder freie Pausentage und Briefe einplanen.</p><div class="planning-tools"><button onclick="go('settings');setTimeout(()=>document.getElementById('yearManagement')?.scrollIntoView({behavior:'smooth',block:'center'}),40)">🧹 Jahresplanung zurücksetzen / Jahr löschen</button></div>${days.map(d=>`<div class="listday"><h3>${nice(d)}</h3>${ps.filter(p=>p.date===d).map(p=>`<div class="card"><span class="pill">${esc(p.freeTitle?'Freie Aktion':act(p)?.category||'Aktion')}</span><h3>${esc(planName(p))}</h3><p>${esc(planSummary(p))}</p><details class="plan-details"><summary>📖 Anleitung, Materialien und weitere Details anzeigen</summary><h4>📖 Anleitung</h4><p style="white-space:pre-wrap">${esc(p.freeSteps||act(p)?.steps||'Keine Anleitung hinterlegt.')}</p><h4>🧺 Materialien</h4><ul>${splitMaterials(p.freeMaterials||act(p)?.materials||'').map(m=>`<li>${esc(m)}</li>`).join('')||'<li>Keine Materialien</li>'}</ul>${(act(p)?.briefs||[]).length?`<h4>✉️ Briefideen</h4>${act(p).briefs.map(b=>`<p class="note"><b>${esc(b.title)}</b><br>${esc(b.body)}</p>`).join('')}`:''}${(act(p)?.images||[]).map(x=>`<img class="thumb" src="${x}" alt="Aktionsbild">`).join('')}</details>${chosenLetter(p)?`<details class="plan-details"><summary>✉️ Ausgewählten Brief anzeigen</summary><b>${esc(chosenLetter(p).title)}</b><p style="white-space:pre-wrap">${esc(chosenLetter(p).body)}</p></details>`:''}<details class="plan-details"><summary>${taskHeading(p,'before','👧 Vor dem Schlafengehen')}</summary>${taskDisplay(p,'before','Vorbereitungen',true)}</details><details class="plan-details"><summary>${taskHeading(p,'after','🌙 Nach dem Einschlafen')}</summary>${taskDisplay(p,'after','Abendvorbereitung',true)}</details><div class="actions">${button('✏️ Planen',`editPlan('${p.id}')`)}${button('🗑️ Entfernen',`removePlan('${p.id}')`)}</div>${completionButton(p)}</div>`).join('')}</div>`).join('')||'<div class="card">Noch keine Aktionen eingeplant.</div>'}`}
function editPlan(pid='',date='',aid=''){let p=state.plans.find(x=>x.id===pid)||{date:date||year().arrival,actionId:aid||state.library[0]?.id,before:'',after:'',materials:[]},a=act(p),items=splitMaterials(a?.materials||''),free=!!p.freeTitle;modal(pid?'Planung bearbeiten':'Aktion einplanen',`<form onsubmit="savePlan(event,'${pid}')">${field('Datum','date',p.date,'date')}<label class="checkline"><input type="checkbox" id="freeToggle" ${free?'checked':''} onchange="toggleFreePlan(this.checked)"> Freie Aktion ohne Handbuch (z. B. Pausentag oder Krankheitsbrief)</label><div id="libraryPlan" style="display:${free?'none':'block'}"><div class="field"><label>Aktion im Handbuch suchen</label><input placeholder="Suchbegriff eingeben …" oninput="filterPlanIdeas(this.value)"><label>Aktion aus dem Handbuch</label><select name="actionId" onchange="changePlanIdea(this.value)">${state.library.map(x=>`<option value="${x.id}" ${p.actionId===x.id?'selected':''}>${esc(x.name)} (${esc(x.category)})</option>`).join('')}</select></div><div id="planMaterials">${materialOptions(items,p.materials)}</div><div id="planLetters">${planLetters(p.actionId,p.letterId||"")}</div></div><div id="freePlan" style="display:${free?'block':'none'}">${field('Titel der freien Aktion','freeTitle',p.freeTitle||'')}${area('Kurzbeschreibung oder Brieftext','freeSummary',p.freeSummary||'')}${area('Anleitung / Notizen','freeSteps',p.freeSteps||'')}${area('Materialien (optional)','freeMaterials',p.freeMaterials||'')}</div>${taskEditor('before','👧 Vor dem Schlafengehen – Was kann dein Kind vorbereiten? (eine Aufgabe pro Zeile)',p.before)}${taskEditor('after','🌙 Nach dem Einschlafen – Meine Vorbereitungen (eine Aufgabe pro Zeile)',p.after)}<button class="primary">Planung speichern</button></form>`)}
function toggleFreePlan(v){document.getElementById('libraryPlan').style.display=v?'none':'block';document.getElementById('freePlan').style.display=v?'block':'none'}
function shopping(){let fromPlans=plans().flatMap(p=>(p.materials||[]).map(name=>({key:p.id+'|'+name,date:p.date,name,action:act(p)?.name||'Aktion',owned:!!state.materials.find(m=>m.key===p.id+'|'+name)?.owned})));let extras=state.extraMaterials.map(m=>({...m,key:'extra|'+m.id,action:'Zusätzlicher Einkauf'}));return [...fromPlans,...extras].filter(x=>!x.owned).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'))}
function materials(){let rows=plans().flatMap(p=>(p.materials||[]).map(name=>({key:p.id+'|'+name,date:p.date,name,action:act(p)?.name||'Aktion',owned:!!state.materials.find(m=>m.key===p.id+'|'+name)?.owned}))).concat(state.extraMaterials.map(m=>({...m,key:'extra|'+m.id,action:'Zusätzlicher Einkauf'}))).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));return `<div class="flex spread"><h2>🧺 Materialien nach Datum</h2><button class="primary" onclick="editExtraMaterial()">+ Material hinzufügen</button></div><p>Die Reihenfolge folgt dem Jahresplan. Du kannst auch unabhängig von Aktionen einkaufen.</p><div class="card"><h3>🛍️ Das brauchst du noch</h3>${rows.filter(m=>!m.owned).map(m=>`<label class="checkline"><input type="checkbox" ${m.owned?'checked':''} onchange="markMaterial('${esc(m.key)}',this.checked)"><span><span class="calendar-date">${m.date?nice(m.date):'Ohne Datum'}</span> · <b>${esc(m.name)}</b> <small class="muted">(${esc(m.action)})</small></span>${m.key.startsWith('extra|')?button('✏️',`editExtraMaterial('${m.key.slice(6)}')`):''}</label>`).join('')||'<p>Noch keine Materialien ausgewählt.</p>'}<details class="plan-details"><summary>✅ Erledigte Einkäufe (${rows.filter(m=>m.owned).length})</summary>${rows.filter(m=>m.owned).map(m=>`<label class="checkline done-material"><input type="checkbox" checked onchange="markMaterial('${esc(m.key)}',this.checked)"><span>${m.date?nice(m.date):'Ohne Datum'} · ${esc(m.name)} (${esc(m.action)})</span></label>`).join('')||'<p>Keine erledigten Einkäufe.</p>'}</details><div class="actions">${button('📋 Einkaufsliste kopieren','copyShopping()')}${button('🖨️ Drucken','window.print()')}</div></div>`}
function markMaterial(key,owned){if(key.startsWith('extra|')){let m=state.extraMaterials.find(x=>x.id===key.slice(6));if(m)m.owned=owned}else{let m=state.materials.find(x=>x.key===key);if(m)m.owned=owned;else state.materials.push({key,owned})}save();render()}
function copyShopping(){let s=shopping().map(x=>(x.date?nice(x.date):'Ohne Datum')+' – '+x.name+' ('+x.action+')').join('\n');navigator.clipboard?.writeText(s).then(()=>alert('Kopiert')).catch(()=>prompt('Einkaufsliste kopieren:',s))||prompt('Falls Kopieren nicht funktioniert:',s)}
function letters(){return `<div class="flex spread"><h2>✉️ Wichtelbriefe</h2><button class="primary" onclick="editLetter()">+ Brief</button></div>${state.letters.map(l=>`<div class="card"><h3>${esc(l.title)}</h3><p style="white-space:pre-wrap">${esc(l.body)}</p>${button('Bearbeiten',`editLetter('${l.id}')`)}${button('Drucken',`printLetter('${l.id}')`)}${button('Löschen',`deleteLetter('${l.id}')`)}</div>`).join('')}`}
function editLetter(lid=''){let l=state.letters.find(x=>x.id===lid)||{title:'',body:''};modal('Wichtelbrief',`<form onsubmit="saveLetter(event,'${lid}')">${field('Titel','title',l.title)}${area('Brieftext','body',l.body)}<button class="primary">Speichern</button></form>`)}function saveLetter(e,lid){e.preventDefault();let o=Object.fromEntries(new FormData(e.target)),l=state.letters.find(x=>x.id===lid);if(l)Object.assign(l,o);else state.letters.push({id:id(),...o});commit()}function deleteLetter(lid){if(confirm('Brief löschen?')){state.letters=state.letters.filter(x=>x.id!==lid);save();render()}}function printLetter(lid){let l=state.letters.find(x=>x.id===lid),w=window.open('','_blank');if(!w)return alert('Pop-ups erlauben');w.document.write('<meta charset="utf-8"><h2>'+esc(l.title)+'</h2><div style="white-space:pre-wrap;font:18px Georgia;line-height:1.8">'+esc(l.body)+'</div>');w.document.close();w.print()}
function characters(){return `<div class="flex spread"><h2>🧝 Wichtel & Helfer</h2><button class="primary" onclick="editCharacter()">+ Wichtel oder Helfer</button></div><p>Steckbriefe bleiben über alle Jahre erhalten. Ergänze neue Geschichten und Entwicklungen.</p>${state.characters.map(c=>`<div class="card"><span class="pill">${esc(c.role)}</span><h3>${esc(c.name)}</h3>${c.photo?`<div><img class="thumb" src="${c.photo}" alt="Bild von ${esc(c.name)}"><div>${button('🗑️ Bild löschen',`deleteCharacterPhoto('${c.id}')`)}</div></div>`:''}${c.traits?`<p><b>Charaktereigenschaften:</b> ${esc(c.traits)}</p>`:''}<p>${esc(c.bio)}</p><p style="white-space:pre-wrap">${esc(c.story)}</p>${(c.extraFields||[]).map(x=>`<p><b>${esc(x.title)}</b>: ${esc(x.value)}</p>`).join('')}<h4>Erinnerungen nach Jahren</h4>${(c.yearNotes||[]).map(n=>`<p class="note"><b>${esc(n.year)}</b>: ${esc(n.note)}</p>`).join('')}${button('✏️ Steckbrief bearbeiten',`editCharacter('${c.id}')`)}${button('📅 Erinnerung hinzufügen',`addCharacterNote('${c.id}')`)}${button('🗑️ Entfernen',`deleteCharacter('${c.id}')`)}</div>`).join('')}`}
function deleteCharacterPhoto(cid){let c=state.characters.find(x=>x.id===cid);if(c&&confirm('Bild aus diesem Steckbrief löschen?')){c.photo='';save();render()}}
function editCharacter(cid=''){let c=state.characters.find(x=>x.id===cid)||{name:'',role:'Wichtel',bio:'',story:'',extraFields:[]};modal('Steckbrief',`<form onsubmit="saveCharacter(event,'${cid}')">${field('Name','name',c.name)}<div class="field"><label>Rolle</label><select name="role">${['Wichtel','Wichtelin','Rentier','Helfer','Tier','Andere'].map(r=>`<option ${c.role===r?'selected':''}>${r}</option>`).join('')}</select></div>${area('Charaktereigenschaften (z. B. neugierig, schüchtern, verspielt)','traits',c.traits||'')}${area('Eigenschaften und Informationen','bio',c.bio)}<div class="field"><label>Foto / Bild (wird automatisch verkleinert)</label><input type="file" accept="image/*" id="characterPhoto"></div>${c.photo?'<p>Ein Bild ist bereits gespeichert. Ein neues Bild ersetzt es.</p>':''}${area('Geschichte und Entwicklung','story',c.story)}<h3>Weitere Steckbrieffelder</h3><div id="extraFields">${(c.extraFields||[]).map(x=>extraFieldHtml(x.title,x.value)).join('')}</div><button type="button" onclick="addExtraField()">+ Feld mit eigenem Titel hinzufügen</button><p><button class="primary">Speichern</button></p></form>`)}
async function saveCharacter(e,cid){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.extraFields=[...e.target.querySelectorAll('.extraField')].map(x=>({title:x.querySelector('.extraTitle').value.trim(),value:x.querySelector('.extraValue').value.trim()})).filter(x=>x.title||x.value);let c=state.characters.find(x=>x.id===cid);let file=document.getElementById('characterPhoto')?.files[0];if(file){if(file.size>2000000){alert('Bitte ein Bild unter 2 MB auswählen.');return}o.photo=await window.wichtelCompressImage(file)}if(c)Object.assign(c,o);else state.characters.push({id:id(),yearNotes:[],...o});commit()}
function addCharacterNote(cid){let c=state.characters.find(x=>x.id===cid);modal('Erinnerung hinzufügen',`<form onsubmit="saveCharacterNote(event,'${cid}')">${field('Wichteljahr','year',year().name)}${area('Was hat sich verändert?','note')}<button class="primary">Speichern</button></form>`)}function saveCharacterNote(e,cid){e.preventDefault();state.characters.find(x=>x.id===cid).yearNotes.push(Object.fromEntries(new FormData(e.target)));commit()}function deleteCharacter(cid){if(confirm('Steckbrief löschen?')){state.characters=state.characters.filter(x=>x.id!==cid);save();render()}}
function archive(){return `<h2>📦 Archiv vergangener Wichteljahre</h2><p>Alle Jahrespläne bleiben erhalten und lassen sich später erneut ansehen.</p>${state.years.map(y=>`<div class="card"><h3>${esc(y.name)} ${y.id===state.year?'· aktuell':''}</h3><p>${nice(y.start)} bis ${nice(y.end)} · ${state.plans.filter(p=>p.year===y.id).length} Aktionen</p>${button('Jahr öffnen',`state.year='${y.id}';save();go('planning')`)}${button('Als Vorlage kopieren',`newYear('${y.id}')`)}</div>`).join('')}`}
function settings(){let y=year();return `<h2>⚙️ Einstellungen</h2><div id="cloudPanel" class="card"><h3>☁️ Familien-Synchronisierung</h3><p>Synchronisierung wird geladen …</p></div><div class="card"><h3>Aktuelles Wichteljahr</h3><select onchange="state.year=this.value;save();render()">${state.years.map(x=>`<option value="${x.id}" ${x.id===state.year?'selected':''}>${esc(x.name)}</option>`).join('')}</select><form onsubmit="saveYear(event)">${field('Name','name',y.name)}${field('Vorbereitungsbeginn','start',y.start,'date')}${field('Einzug','arrival',y.arrival,'date')}${field('Abschied','end',y.end,'date')}<button class="primary">Jahr speichern</button></form>${button('✨ Neues Jahr erstellen','newYear()')}<div class="year-danger" id="yearManagement"><h4>🧹 Jahresplanung neu beginnen</h4><p class="muted">Nur die Planung des ausgewählten Jahres zurücksetzen oder das Wichteljahr vollständig entfernen. Handbuch, Briefe und Steckbriefe bleiben erhalten.</p>${button('🧹 Planung dieses Jahres zurücksetzen','resetYearPlan()')}${button('🗑️ Wichteljahr vollständig löschen','deleteWholeYear()')}</div></div><div class="card"><h3>🏡 Willkommenstext</h3><p class="muted">Optional: Leer lassen für die automatische Begrüßung mit dem Wichtelnamen.</p><textarea id="welcomeText" placeholder="Willkommen bei Lumi ✨" oninput="state.welcomeText=this.value;save()">${esc(state.welcomeText||'')}</textarea></div><div class="card"><h3>🎨 App-Farbe</h3><input type="color" value="${esc(state.theme)}" onchange="state.theme=this.value;save();render()"></div><div class="card"><h3>💾 Sicherung</h3><p>Regelmäßig sichern, besonders bei Gerätewechsel. Fotos können die Datei vergrößern.</p>${button('⬇️ Daten exportieren','exportData()')}<label class="button">⬆️ Sicherung importieren<input type="file" accept=".json" onchange="importData(event)"></label></div>`}
function saveYear(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));if(o.start>o.arrival||o.arrival>o.end)return alert('Datumsreihenfolge prüfen');Object.assign(year(),o);save();render()}
function newYear(sourceId=''){let source=state.years.find(y=>y.id===sourceId)||year(),name=prompt('Name des neuen Jahresplans:','Wichteljahr '+(Number(source.arrival.slice(0,4))+1)),arrival=prompt('Einzugsdatum (JJJJ-MM-TT):',plus(source.arrival,365));if(!name||!arrival||!/^\d{4}-\d{2}-\d{2}$/.test(arrival)||Number.isNaN(new Date(arrival).getTime()))return;let delta=Math.round((new Date(arrival)-new Date(source.arrival))/86400000),y={id:id(),name,arrival,start:plus(source.start,delta),end:plus(source.end,delta)};state.years.push(y);state.plans.push(...state.plans.filter(p=>p.year===source.id).map(p=>({...p,id:id(),year:y.id,date:plus(p.date,delta),beforeDone:false,afterDone:false,completed:false})));state.year=y.id;save();render()}
function resetYearPlan(){let y=year(),n=state.plans.filter(p=>p.year===y.id).length;if(!confirm('Jahresplanung „'+y.name+'“ zurücksetzen?\n\n'+n+' geplante Aktionen und ihre Erledigt-Status werden unwiderruflich gelöscht. Die Ideensammlung, Briefvorlagen, Steckbriefe und andere Jahre bleiben erhalten. Bitte vorher eine Sicherung exportieren.'))return;state.plans=state.plans.filter(p=>p.year!==y.id);save();render();alert('Die Jahresplanung wurde geleert. Du kannst jetzt neu planen.')}
function deleteWholeYear(){let y=year();if(!confirm('Wichteljahr „'+y.name+'“ einschließlich aller geplanten Aktionen dauerhaft löschen?\n\nDas Jahr verschwindet auch aus dem Archiv. Handbuch, Briefe und Steckbriefe bleiben erhalten. Bitte vorher eine Sicherung exportieren.'))return;if(!confirm('Wirklich das gesamte Wichteljahr „'+y.name+'“ löschen? Diese Aktion kann nur mit einer Datensicherung rückgängig gemacht werden.'))return;state.plans=state.plans.filter(p=>p.year!==y.id);state.years=state.years.filter(x=>x.id!==y.id);if(!state.years.length){let n=new Date().getFullYear(),a=n+'-12-01';state.years.push({id:id(),name:'Wichteljahr '+n+'/'+(n+1),start:n+'-11-15',arrival:a,end:(n+1)+'-01-06'})}state.year=state.years[0].id;save();render();alert('Wichteljahr gelöscht. Du kannst jetzt einen neuen Jahresplan anlegen.')}
function exportData(){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=u;a.download='wichtelzauber-sicherung-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}async function importData(e){let f=e.target.files[0];if(!f)return;try{let s=JSON.parse(await f.text());if(!Array.isArray(s.years)||(!Array.isArray(s.library)&&!Array.isArray(s.actions)))throw Error('Ungültige Datei');if(!confirm('Vorhandene Daten durch die Sicherung ersetzen?'))return;state=s;migrate();save();render()}catch(x){alert('Import fehlgeschlagen: '+x.message)}}
let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;document.getElementById('install').hidden=false});document.getElementById('install').onclick=()=>deferred?.prompt();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();

function splitMaterials(v){return (Array.isArray(v)?v:String(v||'').split(/[,;\n]/)).map(x=>String(x).trim()).filter(Boolean)}
function tag(x){return `<span class="pill" data-material="${esc(x)}">${esc(x)} <button type="button" class="tiny" onclick="this.parentElement.remove()">×</button></span> `}
function addMaterialTag(){let f=document.getElementById('newMaterial'),v=f.value.trim();if(!v)return;document.getElementById('materialTags').insertAdjacentHTML('beforeend',tag(v));f.value='';f.focus()}
function taskDisplay(p,key,title,heading=false){let arr=String(p[key]||'').split('\n').map(x=>x.trim()).filter(Boolean),doneKey=key==='before'?'beforeDone':'afterDone';let cb=`<label class="task-check" onclick="event.stopPropagation()"><input type="checkbox" ${p[doneKey]?'checked':''} onchange="checkPlan('${p.id}','${doneKey}',this.checked)"> Erledigt</label>`;return `${heading?'':`<div class="task-head"><strong>${title}</strong>${cb}</div>`}${arr.length?`<ul>${arr.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="muted">Noch keine Aufgaben eingetragen.</p>'}`}
function taskHeading(p,key,title){let doneKey=key==='before'?'beforeDone':'afterDone';return `<span class="task-summary"><span>${title}</span><label class="task-check" onclick="event.stopPropagation()"><input type="checkbox" ${p[doneKey]?'checked':''} onchange="checkPlan('${p.id}','${doneKey}',this.checked)"> Erledigt</label></span>`}
function taskEditor(key,title,raw){let arr=String(raw||'').split('\n').map(x=>x.trim()).filter(Boolean);return `<div class="field"><label>${title}</label><div id="tasks-${key}">${arr.map(x=>taskTag(x)).join('')}</div><input id="task-input-${key}" placeholder="Aufgabe eingeben und Enter drücken" onkeydown="if(event.key==='Enter'){event.preventDefault();addTask('${key}')}"><button type="button" onclick="addTask('${key}')">+ Aufgabe hinzufügen</button></div>`}
function taskTag(t){return `<div class="task-tag"><span>${esc(t)}</span><button type="button" class="tiny" onclick="this.parentElement.remove()" aria-label="Aufgabe entfernen">✕</button></div>`}
function addTask(key){let i=document.getElementById('task-input-'+key),v=i.value.trim();if(!v)return;document.getElementById('tasks-'+key).insertAdjacentHTML('beforeend',taskTag(v));i.value='';i.focus()}
function collectTasks(key){let i=document.getElementById('task-input-'+key);if(i?.value.trim())addTask(key);return [...document.querySelectorAll('#tasks-'+key+' .task-tag span')].map(x=>x.textContent).join('\n')}
function filterPlanIdeas(q){let sel=document.querySelector('#modal select[name=actionId]'),old=sel.value;sel.innerHTML=state.library.filter(x=>(x.name+' '+x.category+' '+x.summary).toLowerCase().includes(q.toLowerCase())).map(x=>`<option value="${x.id}" ${x.id===old?'selected':''}>${esc(x.name)} (${esc(x.category)})</option>`).join('');if(!sel.value&&sel.options.length)sel.selectedIndex=0;changePlanIdea(sel.value)}
function editExtraMaterial(mid=''){let m=state.extraMaterials.find(x=>x.id===mid)||{name:'',date:'',owned:false};modal(mid?'Zusätzlichen Einkauf bearbeiten':'Zusätzlicher Einkauf',`<form onsubmit="saveExtraMaterial(event,'${mid}')">${field('Material','name',m.name)}${field('Datum (optional)','date',m.date,'date')}<button class="primary">Speichern</button> ${mid?`<button type="button" onclick="deleteExtraMaterial('${mid}')">Löschen</button>`:''}</form>`)}
function saveExtraMaterial(e,mid){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));if(!o.name.trim())return;let m=state.extraMaterials.find(x=>x.id===mid);if(m)Object.assign(m,o);else state.extraMaterials.push({id:id(),owned:false,...o});commit()}
function deleteExtraMaterial(mid){if(confirm('Material löschen?')){state.extraMaterials=state.extraMaterials.filter(x=>x.id!==mid);commit()}}
function extraFieldHtml(title='',value=''){return `<div class="card extraField"><label>Überschrift</label><input class="extraTitle" value="${esc(title)}" placeholder="z. B. Lieblingsessen"><label>Information</label><textarea class="extraValue">${esc(value)}</textarea><button type="button" onclick="this.closest('.extraField').remove()">Feld entfernen</button></div>`}
function addExtraField(){document.getElementById('extraFields').insertAdjacentHTML('beforeend',extraFieldHtml())}

function briefFieldHtml(title='',body=''){return `<div class="card briefEntry"><label>Brieftitel</label><input class="briefTitle" value="${esc(title)}" placeholder="z. B. Lumis Entschuldigung"><label>Brieftext</label><textarea class="briefIdea">${esc(body)}</textarea><button type="button" onclick="this.closest('.briefEntry').remove()">Briefidee entfernen</button></div>`}
function addBriefField(title='',body=''){let list=document.getElementById('briefFields');if(!list)return;list.insertAdjacentHTML('beforeend',briefFieldHtml(title,body));let entries=list.querySelectorAll('.briefEntry');let last=entries[entries.length-1];last?.querySelector('.briefTitle')?.focus();last?.scrollIntoView({block:'nearest',behavior:'smooth'});let count=document.getElementById('briefCount');if(count)count.textContent=entries.length+' Briefidee(n) angelegt – alle werden beim Speichern der Idee übernommen.'}
function useLibraryLetter(){let l=state.letters.find(x=>x.id===document.getElementById('libraryLetter').value);if(l)addBriefField(l.title,l.body)}
function planLetters(aid,selected=''){let a=state.library.find(x=>x.id===aid);return `<div class="field"><label>✉️ Brief für diese Aktion auswählen</label><select name="letterId"><option value="">Keinen Brief auswählen</option>${(a?.briefs||[]).map((b,i)=>`<option value="idea:${i}" ${selected==='idea:'+i?'selected':''}>${esc(b.title)}</option>`).join('')}</select></div>`}
function chosenLetter(p){if(!p.letterId)return null;if(p.letterId.startsWith('library:'))return state.letters.find(l=>l.id===p.letterId.slice(8));let i=Number(p.letterId.slice(5));return act(p)?.briefs?.[i]||null}
function materialOptions(items,chosen){return `<h3>🧺 Was auf die Einkaufsliste übernehmen?</h3><p class="muted small">Hake nur die Materialien an, die du besorgen möchtest.</p>${items.map(m=>`<label class="checkline"><input type="checkbox" name="buy" value="${esc(m)}" ${chosen.includes(m)?'checked':''}>${esc(m)}</label>`).join('')||'<p>Keine Materialien hinterlegt.</p>'}`}
function changePlanIdea(aid){let a=state.library.find(x=>x.id===aid);document.getElementById('planMaterials').innerHTML=materialOptions(splitMaterials(a?.materials||''),[]);document.getElementById('planLetters').innerHTML=planLetters(aid)}
function savePlan(e,pid){e.preventDefault();let f=e.target,o=Object.fromEntries(new FormData(f)),free=f.querySelector('#freeToggle').checked;o.before=collectTasks('before');o.after=collectTasks('after');o.materials=free?[]:[...f.querySelectorAll('input[name=buy]:checked')].map(x=>x.value);if(free){o.letterId='';o.actionId='';if(!o.freeTitle.trim())return alert('Bitte einen Titel für die freie Aktion eingeben.')}else{o.freeTitle='';o.freeSummary='';o.freeSteps='';o.freeMaterials=''}let p=state.plans.find(x=>x.id===pid);if(p)Object.assign(p,o);else state.plans.push({id:id(),year:state.year,beforeDone:false,afterDone:false,completed:false,...o});commit()}
function removePlan(pid){if(confirm('Aktion aus diesem Jahresplan entfernen?')){state.plans=state.plans.filter(x=>x.id!==pid);save();render()}}
</script><script src="sync.js"></script></body></html>
